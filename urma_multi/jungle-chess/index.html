<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>斗兽棋 · 双人对战</title>
  <style>
    :root {
      --bg: #1a1410;
      --panel: #2a2218;
      --board: #c9a66b;
      --board-dark: #b8924f;
      --river: #5ba4c9;
      --river-deep: #3d8ab0;
      --trap: #8b6914;
      --den: #5c3d2e;
      --red: #c0392b;
      --red-light: #e74c3c;
      --blue: #2471a3;
      --blue-light: #3498db;
      --text: #f5e6c8;
      --muted: #a89070;
      --highlight: #f1c40f;
      --move: rgba(46, 204, 113, 0.45);
      --capture: rgba(231, 76, 60, 0.5);
      --selected: rgba(241, 196, 15, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 20% 0%, #3d2b1f 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, #2a1f15 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #f1c40f, #e67e22);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }

    .game-wrap {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 1100px;
      width: 100%;
    }

    .board-area { flex: 0 0 auto; }

    .player-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .player-bar.blue {
      background: linear-gradient(90deg, rgba(36,113,163,0.35), transparent);
      border: 1px solid rgba(52,152,219,0.4);
    }

    .player-bar.red {
      background: linear-gradient(90deg, transparent, rgba(192,57,43,0.35));
      border: 1px solid rgba(231,76,60,0.4);
      margin-top: 8px;
      margin-bottom: 0;
    }

    .player-bar.active {
      box-shadow: 0 0 20px rgba(241,196,15,0.3);
      border-color: var(--highlight);
    }

    .player-bar .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }

    .player-bar.blue .dot { background: var(--blue-light); }
    .player-bar.red .dot { background: var(--red-light); }

    .board {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(9, 1fr);
      gap: 3px;
      background: #5a3e28;
      padding: 6px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
      width: min(92vw, 420px);
      aspect-ratio: 7 / 9;
    }

    .cell {
      position: relative;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s, box-shadow 0.2s;
      user-select: none;
    }

    .cell:hover:not(.disabled) { transform: scale(1.04); z-index: 2; }

    .cell.normal { background: var(--board); }
    .cell.normal:nth-child(odd) { background: var(--board-dark); }

    .cell.river {
      background: linear-gradient(160deg, var(--river), var(--river-deep));
      cursor: default;
    }

    .cell.trap-p0 {
      background: repeating-linear-gradient(45deg, var(--board), var(--board) 4px, rgba(139,105,20,0.5) 4px, rgba(139,105,20,0.5) 8px);
    }

    .cell.trap-p1 {
      background: repeating-linear-gradient(-45deg, var(--board), var(--board) 4px, rgba(139,105,20,0.5) 4px, rgba(139,105,20,0.5) 8px);
    }

    .cell.den-p0 {
      background: radial-gradient(circle, #7a4f3a, var(--den));
      border: 2px dashed rgba(192,57,43,0.6);
    }

    .cell.den-p1 {
      background: radial-gradient(circle, #4a6a8a, #2c4a62);
      border: 2px dashed rgba(52,152,219,0.6);
    }

    .cell.selected { box-shadow: inset 0 0 0 3px var(--highlight); }
    .cell.move-hint { box-shadow: inset 0 0 0 3px #2ecc71; background-color: color-mix(in srgb, var(--move) 60%, var(--board)) !important; }
    .cell.capture-hint { box-shadow: inset 0 0 0 3px #e74c3c; background-color: color-mix(in srgb, var(--capture) 60%, var(--board)) !important; }

    .cell-label {
      position: absolute;
      font-size: 0.55rem;
      color: rgba(0,0,0,0.25);
      top: 2px; left: 4px;
      pointer-events: none;
    }

    .piece {
      width: 78%;
      height: 78%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.9rem, 3.5vw, 1.3rem);
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      transition: transform 0.15s;
      z-index: 1;
    }

    .piece.p0 { background: linear-gradient(145deg, var(--red-light), var(--red)); color: #fff; border: 2px solid #922b21; }
    .piece.p1 { background: linear-gradient(145deg, var(--blue-light), var(--blue)); color: #fff; border: 2px solid #1a5276; }

    .piece .rank {
      position: absolute;
      bottom: -2px; right: -2px;
      font-size: 0.55rem;
      background: rgba(0,0,0,0.5);
      border-radius: 50%;
      width: 14px; height: 14px;
      display: flex; align-items: center; justify-content: center;
    }

    .sidebar {
      flex: 1;
      min-width: 260px;
      max-width: 340px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--panel);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .card h3 {
      font-size: 0.85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
    }

    .status-msg {
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 1.5em;
      color: var(--highlight);
    }

    .log {
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .log .entry { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 3px 0; }
    .log .p0 { color: var(--red-light); }
    .log .p1 { color: var(--blue-light); }

    .rank-table {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px 12px;
      font-size: 0.82rem;
    }

    .rank-table span { color: var(--muted); }
    .rank-table b { color: var(--text); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    button {
      flex: 1;
      min-width: 100px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    button.primary {
      background: linear-gradient(135deg, #e67e22, #d35400);
      color: #fff;
    }

    button.secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.1); }
    button:active { transform: translateY(0); }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .overlay.show { display: flex; }

    .modal {
      background: var(--panel);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 360px;
      border: 1px solid rgba(241,196,15,0.3);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .modal h2 { font-size: 1.6rem; margin-bottom: 8px; }
    .modal p { color: var(--muted); margin-bottom: 20px; }
    .modal .winner { font-size: 2rem; margin: 12px 0; }

    @media (max-width: 700px) {
      .game-wrap { flex-direction: column; align-items: center; }
      .sidebar { max-width: 100%; width: min(92vw, 420px); }
    }
  </style>
</head>
<body>
  <header>
    <h1>斗 兽 棋</h1>
    <p>双人对战 · 同屏轮流操作</p>
  </header>

  <div class="game-wrap">
    <div class="board-area">
      <div class="player-bar blue" id="bar-p1">
        <span><span class="dot"></span>蓝方（上）· 先手</span>
        <span id="count-p1">8 子</span>
      </div>
      <div class="board" id="board"></div>
      <div class="player-bar red" id="bar-p0">
        <span><span class="dot"></span>红方（下）· 后手</span>
        <span id="count-p0">8 子</span>
      </div>
    </div>

    <div class="sidebar">
      <div class="card">
        <h3>当前状态</h3>
        <div class="status-msg" id="status">蓝方回合，请选择棋子</div>
        <div class="btn-row" style="margin-top:12px">
          <button class="primary" id="btn-restart">重新开始</button>
          <button class="secondary" id="btn-undo">悔棋</button>
        </div>
      </div>

      <div class="card">
        <h3>走棋记录</h3>
        <div class="log" id="log"></div>
      </div>

      <div class="card">
        <h3>棋子等级（大吃小）</h3>
        <div class="rank-table">
          <span>8 象</span><b>＞ 7 狮 ＞ 6 虎</b>
          <span>5 豹</span><b>＞ 4 狼 ＞ 3 狗</b>
          <span>2 猫</span><b>＞ 1 鼠</b>
        </div>
        <p style="font-size:0.78rem;color:var(--muted);margin-top:10px;line-height:1.6">
          鼠可吃象；象不能吃鼠。鼠可过河，狮虎可跳河。进入对方兽穴即胜。
        </p>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2>游戏结束</h2>
      <div class="winner" id="winner-text"></div>
      <p id="win-reason"></p>
      <button class="primary" id="btn-play-again" style="width:100%">再来一局</button>
    </div>
  </div>

  <script>
    const COLS = 7, ROWS = 9;
    const PIECES = [
      { rank: 1, name: '鼠', emoji: '🐭' },
      { rank: 2, name: '猫', emoji: '🐱' },
      { rank: 3, name: '狗', emoji: '🐶' },
      { rank: 4, name: '狼', emoji: '🐺' },
      { rank: 5, name: '豹', emoji: '🐆' },
      { rank: 6, name: '虎', emoji: '🐯' },
      { rank: 7, name: '狮', emoji: '🦁' },
      { rank: 8, name: '象', emoji: '🐘' },
    ];
    const PLAYER_NAMES = ['红方', '蓝方'];

    // Cell types
    const CELL = { NORMAL: 0, RIVER: 1, TRAP_P0: 2, TRAP_P1: 3, DEN_P0: 4, DEN_P1: 5 };

    function buildTerrain() {
      const t = Array.from({ length: ROWS }, () => Array(COLS).fill(CELL.NORMAL));
      // River: cols 1,2 and 4,5, rows 3-5
      for (let r = 3; r <= 5; r++)
        for (let c of [1, 2, 4, 5]) t[r][c] = CELL.RIVER;
      // Dens
      t[0][3] = CELL.DEN_P1; // blue den (top)
      t[8][3] = CELL.DEN_P0; // red den (bottom)
      // Traps
      t[2][2] = CELL.TRAP_P1; t[2][4] = CELL.TRAP_P1;
      t[6][2] = CELL.TRAP_P0; t[6][4] = CELL.TRAP_P0;
      return t;
    }

    const TERRAIN = buildTerrain();

    function initialBoard() {
      const b = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      // Blue (player 1, top)
      const blue = [
        [1, 0, 7], [5, 0, 6], // Lion, Tiger
        [0, 1, 8], [1, 1, 4], [2, 1, 2], [4, 1, 3], [5, 1, 5], [6, 1, 1], // E,W,C,D,L,R
      ];
      // Red (player 0, bottom)
      const red = [
        [1, 8, 7], [5, 8, 6],
        [0, 7, 1], [1, 7, 5], [2, 7, 2], [4, 7, 3], [5, 7, 4], [6, 7, 8],
      ];
      for (const [c, r, rank] of blue) b[r][c] = { player: 1, rank };
      for (const [c, r, rank] of red) b[r][c] = { player: 0, rank };
      return b;
    }

    function isRiver(r, c) { return TERRAIN[r][c] === CELL.RIVER; }
    function isTrap(r, c, player) {
      const t = TERRAIN[r][c];
      return t === CELL.TRAP_P0 || t === CELL.TRAP_P1;
    }
    function trapOwner(r, c) {
      const t = TERRAIN[r][c];
      if (t === CELL.TRAP_P0) return 0;
      if (t === CELL.TRAP_P1) return 1;
      return -1;
    }
    function isDen(r, c) {
      return TERRAIN[r][c] === CELL.DEN_P0 || TERRAIN[r][c] === CELL.DEN_P1;
    }
    function denOwner(r, c) {
      if (TERRAIN[r][c] === CELL.DEN_P0) return 0;
      if (TERRAIN[r][c] === CELL.DEN_P1) return 1;
      return -1;
    }
    function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }

    function canCapture(attacker, defender, defR, defC) {
      if (!defender) return false;
      const aRank = attacker.rank, dRank = defender.rank;
      const defInTrap = trapOwner(defR, defC) === attacker.player;
      // Defender in attacker's trap → any attacker can capture
      if (defInTrap) return true;
      // Special: rat vs elephant
      if (aRank === 1 && dRank === 8) return true;
      if (aRank === 8 && dRank === 1) return false;
      // Rat in water: only rat can capture it
      if (isRiver(defR, defC) && dRank === 1 && aRank !== 1) return false;
      // Equal or higher rank attacker wins
      return aRank >= dRank;
    }

    function getMoves(board, r, c, piece) {
      const moves = [];
      const player = piece.player;
      const dirs = [[0,1],[0,-1],[1,0],[-1,0]];

      for (const [dr, dc] of dirs) {
        const nr = r + dr, nc = c + dc;
        if (!inBounds(nr, nc)) continue;
        // Can't enter own den
        if (denOwner(nr, nc) === player) continue;
        // River: only rat can enter
        if (isRiver(nr, nc) && piece.rank !== 1) continue;

        const target = board[nr][nc];
        if (!target) {
          moves.push({ r: nr, c: nc, capture: false });
        } else if (target.player !== player && canCapture(piece, target, nr, nc)) {
          moves.push({ r: nr, c: nc, capture: true });
        }
      }

      // Lion & Tiger river jump (horizontal & vertical)
      if (piece.rank === 6 || piece.rank === 7) {
        for (const [dr, dc] of dirs) {
          // Try jump distance 3 (over 2 river cells)
          const nr = r + dr * 3, nc = c + dc * 3;
          if (!inBounds(nr, nc)) continue;
          if (denOwner(nr, nc) === player) continue;

          // Check intermediate cells are river and no blocking rat
          let blocked = false;
          for (let i = 1; i <= 2; i++) {
            const mr = r + dr * i, mc = c + dc * i;
            if (!isRiver(mr, mc)) { blocked = true; break; }
            const mid = board[mr][mc];
            if (mid && mid.rank === 1) { blocked = true; break; }
          }
          if (blocked) continue;

          const target = board[nr][nc];
          if (!target) {
            if (!moves.some(m => m.r === nr && m.c === nc))
              moves.push({ r: nr, c: nc, capture: false, jump: true });
          } else if (target.player !== player && canCapture(piece, target, nr, nc)) {
            if (!moves.some(m => m.r === nr && m.c === nc))
              moves.push({ r: nr, c: nc, capture: true, jump: true });
          }
        }
      }

      return moves;
    }

    function countPieces(board, player) {
      let n = 0;
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++)
          if (board[r][c]?.player === player) n++;
      return n;
    }

    function hasAnyMove(board, player) {
      for (let r = 0; r < ROWS; r++)
        for (let c = 0; c < COLS; c++) {
          const p = board[r][c];
          if (p?.player === player && getMoves(board, r, c, p).length > 0) return true;
        }
      return false;
    }

  // ── Game State ──
    let board, currentPlayer, selected, validMoves, history, gameOver, logEntries;

    function initGame() {
      board = initialBoard();
      currentPlayer = 1; // blue first
      selected = null;
      validMoves = [];
      history = [];
      gameOver = false;
      logEntries = [];
      document.getElementById('overlay').classList.remove('show');
      render();
      updateStatus(`${PLAYER_NAMES[1]}回合，请选择棋子`);
      document.getElementById('log').innerHTML = '';
    }

    function updateStatus(msg) {
      document.getElementById('status').textContent = msg;
      document.getElementById('bar-p0').classList.toggle('active', currentPlayer === 0 && !gameOver);
      document.getElementById('bar-p1').classList.toggle('active', currentPlayer === 1 && !gameOver);
      document.getElementById('count-p0').textContent = countPieces(board, 0) + ' 子';
      document.getElementById('count-p1').textContent = countPieces(board, 1) + ' 子';
    }

    function addLog(msg, player) {
      logEntries.unshift({ msg, player });
      if (logEntries.length > 30) logEntries.pop();
      const log = document.getElementById('log');
      log.innerHTML = logEntries.map(e =>
        `<div class="entry"><span class="p${e.player}">${PLAYER_NAMES[e.player]}</span> ${e.msg}</div>`
      ).join('');
    }

    function checkWin(movedPiece, toR, toC) {
      const opp = 1 - currentPlayer;
      // Entered opponent den
      if (denOwner(toR, toC) === opp) return { win: true, reason: '攻入对方兽穴！' };
      // Opponent has no pieces
      if (countPieces(board, opp) === 0) return { win: true, reason: '吃光了对方所有棋子！' };
      // Opponent cannot move
      if (!hasAnyMove(board, opp)) return { win: true, reason: '对方无棋可走！' };
      return { win: false };
    }

    function endGame(winner, reason) {
      gameOver = true;
      document.getElementById('winner-text').textContent = `🎉 ${PLAYER_NAMES[winner]} 获胜！`;
      document.getElementById('winner-text').style.color = winner === 0 ? 'var(--red-light)' : 'var(--blue-light)';
      document.getElementById('win-reason').textContent = reason;
      document.getElementById('overlay').classList.add('show');
      updateStatus(`游戏结束 — ${PLAYER_NAMES[winner]}胜`);
    }

    function applyMove(fromR, fromC, toR, toC) {
      const piece = board[fromR][fromC];
      const captured = board[toR][toC];
      history.push({
        board: board.map(row => row.map(c => c ? { ...c } : null)),
        currentPlayer,
        fromR, fromC, toR, toC,
      });

      board[toR][toC] = piece;
      board[fromR][fromC] = null;

      const pInfo = PIECES[piece.rank - 1];
      let msg = `${pInfo.emoji}${pInfo.name} → (${toC},${toR})`;
      if (captured) {
        const cInfo = PIECES[captured.rank - 1];
        msg += `，吃 ${cInfo.emoji}${cInfo.name}`;
      }
      addLog(msg, currentPlayer);

      const result = checkWin(piece, toR, toC);
      if (result.win) {
        endGame(currentPlayer, result.reason);
        render();
        return;
      }

      currentPlayer = 1 - currentPlayer;
      selected = null;
      validMoves = [];
      updateStatus(`${PLAYER_NAMES[currentPlayer]}回合，请选择棋子`);
      render();
    }

    function undo() {
      if (!history.length || gameOver) return;
      const last = history.pop();
      board = last.board.map(row => row.map(c => c ? { ...c } : null));
      currentPlayer = last.currentPlayer;
      selected = null;
      validMoves = [];
      gameOver = false;
      document.getElementById('overlay').classList.remove('show');
      if (logEntries.length) logEntries.shift();
      document.getElementById('log').innerHTML = logEntries.map(e =>
        `<div class="entry"><span class="p${e.player}">${PLAYER_NAMES[e.player]}</span> ${e.msg}</div>`
      ).join('');
      updateStatus(`${PLAYER_NAMES[currentPlayer]}回合（已悔棋）`);
      render();
    }

    function terrainClass(r, c) {
      const t = TERRAIN[r][c];
      switch (t) {
        case CELL.RIVER: return 'river';
        case CELL.TRAP_P0: return 'trap-p0';
        case CELL.TRAP_P1: return 'trap-p1';
        case CELL.DEN_P0: return 'den-p0';
        case CELL.DEN_P1: return 'den-p1';
        default: return 'normal';
      }
    }

    function render() {
      const el = document.getElementById('board');
      el.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.className = `cell ${terrainClass(r, c)}`;
          cell.dataset.r = r;
          cell.dataset.c = c;

          if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
          const hint = validMoves.find(m => m.r === r && m.c === c);
          if (hint) cell.classList.add(hint.capture ? 'capture-hint' : 'move-hint');

          const piece = board[r][c];
          if (piece) {
            const pEl = document.createElement('div');
            pEl.className = `piece p${piece.player}`;
            const info = PIECES[piece.rank - 1];
            pEl.innerHTML = `${info.emoji}<span class="rank">${piece.rank}</span>`;
            cell.appendChild(pEl);
          }

          if (isDen(r, c)) {
            const lbl = document.createElement('span');
            lbl.className = 'cell-label';
            lbl.textContent = '穴';
            cell.appendChild(lbl);
          } else if (isTrap(r, c, 0) || isTrap(r, c, 1)) {
            const lbl = document.createElement('span');
            lbl.className = 'cell-label';
            lbl.textContent = '陷';
            cell.appendChild(lbl);
          }

          cell.addEventListener('click', () => onCellClick(r, c));
          el.appendChild(cell);
        }
      }
    }

    function onCellClick(r, c) {
      if (gameOver) return;
      const piece = board[r][c];
      const hint = validMoves.find(m => m.r === r && m.c === c);

      if (hint && selected) {
        applyMove(selected.r, selected.c, r, c);
        return;
      }

      if (piece && piece.player === currentPlayer) {
        selected = { r, c };
        validMoves = getMoves(board, r, c, piece);
        const info = PIECES[piece.rank - 1];
        updateStatus(`已选 ${info.emoji}${info.name}，请选择目标格`);
        render();
        return;
      }

      // Deselect
      if (selected) {
        selected = null;
        validMoves = [];
        updateStatus(`${PLAYER_NAMES[currentPlayer]}回合，请选择棋子`);
        render();
      }
    }

    document.getElementById('btn-restart').addEventListener('click', initGame);
    document.getElementById('btn-play-again').addEventListener('click', initGame);
    document.getElementById('btn-undo').addEventListener('click', undo);

    initGame();
  </script>
</body>
</html>
